<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}ML Scanner{% endblock %} — Task 03</title>
  <script src="/vendor/tailwind-play.js"></script>
  <script src="/vendor/htmx.min.js" defer></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { colors: { tn: {
        bg:'#0a0e14', panel:'#11151c', border:'#1e2530',
        blue:'#7aa2f7', green:'#9ece6a', red:'#f7768e',
        yellow:'#e0af68', purple:'#bb9af7', cyan:'#7dcfff',
        text:'#c0caf5', muted:'#565f89'
      }}, fontFamily: { mono: ['ui-monospace', 'Consolas', 'monospace'] } } }
    }
  </script>
  <style>
    body { font-family: ui-monospace, Consolas, monospace; background: #0a0e14; color: #c0caf5; }
    .htmx-indicator { opacity: 0; transition: opacity 200ms; }
    .htmx-request .htmx-indicator { opacity: 1; }
    #toast-container { position: fixed; bottom: 1.5rem; right: 1.5rem; z-index: 9999; }
    ::-webkit-scrollbar { width: 5px; } ::-webkit-scrollbar-track { background: #0a0e14; }
    ::-webkit-scrollbar-thumb { background: #1e2530; border-radius: 3px; }
  </style>
  {% block head %}{% endblock %}
</head>
<body class="min-h-screen flex flex-col">
  <header class="border-b border-tn-border bg-tn-panel sticky top-0 z-50">
    <nav class="max-w-6xl mx-auto px-4 h-14 flex items-center justify-between">
      <div class="flex items-center gap-4">
        <a href="/" class="text-tn-green font-bold text-sm">ML Safety Scanner <span class="text-tn-muted font-normal">v0.0.30</span></a>
      </div>
      <div class="flex items-center gap-4 text-xs">
        <a href="/" class="text-tn-text hover:text-tn-blue">Scan</a>
        <a href="/submit" class="text-tn-text hover:text-tn-blue">Загрузка</a>
        <a href="/dns-log" class="text-tn-text hover:text-tn-blue">DNS-журнал</a>
        <a href="/history" class="text-tn-text hover:text-tn-blue">История</a>
          <span class="text-tn-muted">{{ team.team_name }}</span>
      </div>
    </nav>
  </header>

  <main class="flex-1 max-w-6xl mx-auto w-full px-4 py-8">
    {% block content %}{% endblock %}
  </main>

  <footer class="border-t border-tn-border bg-tn-panel">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between text-xs text-tn-muted">
      <span>Защищено Picklescan 0.0.30</span>
    </div>
  </footer>

  <div id="toast-container"></div>
  <script>
    function showToast(msg, type='info') {
      const c={success:'border-tn-green text-tn-green bg-green-900/30',error:'border-tn-red text-tn-red bg-red-900/30',info:'border-tn-blue text-tn-blue bg-blue-900/30'};
      const d=document.createElement('div');
      d.className=`border rounded px-4 py-2 text-sm mb-2 ${c[type]||c.info}`;
      d.textContent=msg;
      document.getElementById('toast-container').prepend(d);
      setTimeout(()=>d.remove(),4000);
    }
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
