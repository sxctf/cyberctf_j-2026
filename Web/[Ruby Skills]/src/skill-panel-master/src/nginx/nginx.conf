events {
    worker_connections 1024;
}

http {
    lua_package_path "/etc/nginx/lua/?.lua;;";

    init_by_lua_block { 
        require "cjson" 
    }

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    upstream admin-service {
        server admin-service:5001;
    }

    server {
        listen 80;
        server_name _;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;

        location /admin/healthcheck {
            access_by_lua_block {
                local ct = ngx.req.get_headers()["Content-Type"]
                if ct == "application/json" then
                    local cjson = require "cjson"
                    ngx.req.read_body()
                    local rd = ngx.req.get_body_data()
                    if rd then
                        local d = cjson.decode(rd)
                        if d.host then
                            local m = ngx.re.match(d.host, "^[A-Za-z0-9._-]+$")
                            if m == nil then
                                ngx.exit(ngx.HTTP_FORBIDDEN)
                            end
                        end
                    end
                end
                ngx.exit(0)
            }
            proxy_pass http://admin-service/admin/healthcheck;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://admin-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
